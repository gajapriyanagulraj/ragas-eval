release_id: employee-rag-v1.0.0
manifest_version: 1.0
created_at: "2026-06-09T00:00:00Z"
environment: dev
rag_framework: langchain

model:
  provider: nvidia
  name: meta/llama-3.3-70b-instruct
  base_url: https://integrate.api.nvidia.com/v1
  api_key_env: NVIDIA_API_KEY
  temperature: 0.1
  max_tokens: 1000

dataset:
  path: evaluation/qa_dataset.json
  version: 1.0
  questions: 5

prompt:
  name: employee_assistant
  version: 1

retrieval:
  enabled: true
  vector_store: chromadb
  collection_name: employee_handbook
  embedding_provider: voyage
  embedding_model: voyage-3-large
  check_embedding_ctx_length: false
  chunk_size: 800
  chunk_overlap: 150
  top_k: 5
  reranker: null

evaluation:
  ragas: true
  scoring_mode: ragas_llm_as_judge
  evaluator:
    provider: nvidia
    name: meta/llama-3.3-70b-instruct
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
  retrieval_metrics:
    - context_precision
    - context_recall
  generation_metrics:
    - faithfulness
    - answer_relevancy
    - answer_correctness
  derived_metrics:
    - context_relevance
    - completeness
    - hallucination_rate

performance:
  capture_latency: true
  capture_token_usage: true

observability:
  provider: langsmith
  enabled: true
  project: employee-rag-evaluation
  dataset: Employee Handbook Evaluation
  trace_rag_pipeline: true
  push_ragas_feedback: true

gates:
  min_context_relevance: 0.80
  min_faithfulness: 0.85
  min_response_relevance: 0.85
  min_completeness: 0.80
  max_hallucination_rate: 0.10

governance:
  immutable: true
